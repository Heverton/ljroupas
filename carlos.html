<form action="#" method="POST">
    <!-- Linha 1: Campo de Nome -->
    <div style="margin-bottom: 15px;">
        <label for="nome completo">Nome:</label><br>
        <input type="text" id="nome completo" name="nome completo" placeholder="Digite seu nome completo" required>
    </div>

    <!-- Linha 2: Campo de E-mail -->
    <div style="margin-bottom: 15px;">
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
    </div>

    <!-- Linha 3: Botão de Envio -->
    <div>
        <button type="submit">Enviar Dados</button>
    </div>
</form>
