<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="css/Rf01.css">
</head>



<body>
  <header>
    <h1>Gestão de Clientes</h1>
    <button type="button" class="btn btn-primario" id="btnNovo">+ Novo Cliente</button>
  </header>

  <section class="filtros" aria-label="Filtros de busca">
    <div class="campo">
      <label for="filtroBusca">Buscar</label>
      <input type="search" id="filtroBusca" placeholder="Nome, CPF ou e-mail">
    </div>
    <div class="campo">
      <label for="filtroStatus">Status</label>
      <select id="filtroStatus">
        <option value="">Todos</option>
        <option value="Ativo">Ativo</option>
        <option value="Inativo">Inativo</option>
      </select>
    </div>
  </section>

  <p class="resumo" id="resumo" aria-live="polite"></p>

  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Cidade/UF</th>
          <th>Status</th>
          <th class="col-acoes">Ações</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
    <p class="vazio" id="vazio" hidden>Nenhum cliente encontrado. Ajuste os filtros ou cadastre um novo cliente.</p>
  </div>

  <section class="formulario-wrap" aria-labelledby="tituloForm">
    <h2 id="tituloForm">Cadastrar cliente</h2>
    <div class="alerta" id="alertaForm" role="alert" hidden></div>

    <form id="formCliente" novalidate>
      <input type="hidden" id="clienteId">

      <fieldset>
        <legend>Dados pessoais</legend>
        <div class="grade">
          <div class="campo span-2">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" maxlength="120" autocomplete="off" required>
            <small class="erro" data-erro="nome"></small>
          </div>
          <div class="campo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
            <small class="erro" data-erro="cpf"></small>
          </div>
          <div class="campo">
            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento">
            <small class="erro" data-erro="dataNascimento"></small>
          </div>
          <div class="campo">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="">Não informado</option>
              <option value="F">Feminino</option>
              <option value="M">Masculino</option>
              <option value="O">Outro</option>
            </select>
          </div>
          <div class="campo">
            <label for="status">Status</label>
            <select id="status">
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>
        <div class="grade">
          <div class="campo span-2">
            <label for="email">E-mail</label>
            <input type="email" id="email" maxlength="120" autocomplete="off">
            <small class="erro" data-erro="email"></small>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000">
            <small class="erro" data-erro="telefone"></small>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <div class="grade">
          <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000">
            <small class="erro" data-erro="cep"></small>
          </div>
          <div class="campo span-2">
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" maxlength="120">
          </div>
          <div class="campo">
            <label for="numero">Número</label>
            <input type="text" id="numero" maxlength="10">
          </div>
          <div class="campo span-2">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" maxlength="60">
          </div>
          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" maxlength="60">
          </div>
          <div class="campo span-2">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" maxlength="60">
          </div>
          <div class="campo">
            <label for="uf">UF</label>
            <select id="uf"></select>
          </div>
        </div>
      </fieldset>

      <div class="rodape-form">
        <button type="button" class="btn" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar cliente</button>
      </div>
    </form>
  </section>

  <!-- Referência ao JavaScript -->
  <script src="js/Rf01.js"></script>
</body>
</html>
