<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Acesso</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #1f3a5f;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: #162b47;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 16px 22px;
            display: block;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: #2d5988;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #1f3a5f;
        }

        .card p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .botao {
            display: inline-block;
            background-color: #1f3a5f;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .botao:hover {
            background-color: #2d5988;
        }

        footer {
            background-color: #162b47;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                text-align: center;
            }

            main {
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Portal</h1>
        <p>Portal de acesso às páginas e aos projetos</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="contatos.html">Contatos</a>

        <a href="CADU.html">CARLOS SILVA DOS SANTOS</a>
        <a href="aluno7.html">aluno7</a>
    </nav>

    <main>
        <h2>Bem-vindo ao meu primeiro portal!</h2>
    </main>

    <footer>
        <p>&copy; 2026 - 2027 - Meu Portal</p>
    </footer>

</body>
</html>
