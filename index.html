<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Contatos</title>
  <link rel="stylesheet" href="css/geral.css">
</head>
<body>
  <div class="container">
    <h1>Contatos</h1>
    <p class="subtitulo">Exemplo de CRUD: adicionar, listar, editar e excluir.</p>

    <!-- ====================== FORMULÁRIO ====================== -->
    <div class="cartao">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex: Maria Silva">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Ex: maria@email.com">
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" placeholder="Ex: (11) 99999-9999">
      </div>
      <div class="botoes">
        <button class="btn-principal" id="btnSalvar" onclick="salvar()">Adicionar</button>
        <button class="btn-cancelar" id="btnCancelar" onclick="cancelarEdicao()">Cancelar</button>
      </div>
    </div>

    <!-- ====================== LISTA ====================== -->
    <div class="cartao">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
      <div class="vazio" id="mensagemVazia">Nenhum contato ainda. Adicione o primeiro acima.</div>
    </div>
  </div>

  <script src="js/index.js"></script>
  
</body>
</html>
